<!DOCTYPE html><html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Zélia Ponto · Fixo</title>
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/human@3.3.5/dist/human.js"></script>
<style>
/* fontes self-hosted — mesmo padrão do app */
@font-face{font-family:"Inter";src:url("fonts/inter.woff2") format("woff2");font-weight:400 700;font-style:normal;font-display:swap}
@font-face{font-family:"Poppins";src:url("fonts/poppins-600.woff2") format("woff2");font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:"Sora";src:url("fonts/sora-800.woff2") format("woff2");font-weight:800;font-style:normal;font-display:swap}
:root{--z-verde:#14A673;--z-verde-esc:#0C4B35;--z-verde-cl:#E6F5EE;--z-ambar:#F6A93B;--z-ambar-cl:#FFF4E0;
  --z-cinza:#6B7B74;--z-linha:#E7ECE9;--z-verm:#E5533D;--z-verm-cl:#FCEBE7;--z-texto:#1C2926}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--z-texto);
  background:radial-gradient(120% 80% at 15% 0%,#e6f5ee 0%,#eef4f0 45%,#e9f2ec 100%);-webkit-font-smoothing:antialiased}
.scr{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top) + 28px) 28px calc(env(safe-area-inset-bottom) + 28px);text-align:center}
.scr.on{display:flex}

/* logo + empresa (topo) */
.logo{position:fixed;top:calc(env(safe-area-inset-top) + 18px);left:0;right:0;display:flex;align-items:center;justify-content:center;gap:9px;z-index:4}
.logo .dot{width:24px;height:24px;border-radius:50%;background:conic-gradient(from 0deg,#14A673,#25D366,#14A673);
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px;font-family:"Sora"}
.logo b{font-family:"Sora";font-weight:800;font-size:19px;color:var(--z-verde-esc);letter-spacing:-.02em}
.emp{position:fixed;top:calc(env(safe-area-inset-top) + 50px);left:0;right:0;text-align:center;font-size:13px;color:var(--z-cinza);font-weight:600;z-index:4}

h1{font-family:"Poppins";font-weight:600;font-size:27px;color:var(--z-verde-esc);margin-bottom:10px}
.sub{font-size:16px;color:var(--z-cinza);margin-bottom:24px;max-width:440px;line-height:1.5}
.sub b{color:var(--z-verde-esc)}

/* botões */
.btn-verde{display:inline-flex;align-items:center;justify-content:center;gap:9px;background:var(--z-verde);color:#fff;border:none;
  border-radius:15px;padding:17px 26px;font-family:"Poppins";font-weight:600;font-size:17px;cursor:pointer;width:100%;max-width:420px;
  box-shadow:0 16px 34px -16px rgba(20,166,115,.7)}
.btn-verde:active{transform:scale(.98)}
.btn-ghost{background:#fff;color:var(--z-verde-esc);border:1px solid var(--z-linha);box-shadow:none}
.btn-verde+.btn-ghost,.btn-verde+.btn-verde{margin-top:12px}

/* HOME — botão redondo gigante (igual Home do app) */
.bigwrap{display:flex;flex-direction:column;align-items:center;gap:14px;margin:8px 0 6px}
.bigbtn{width:200px;height:200px;border-radius:50%;position:relative;display:flex;align-items:center;justify-content:center;background:none;border:none;padding:0;cursor:pointer}
.bigbtn:active{transform:scale(.97)}
.bigbtn .ring{position:absolute;inset:-9px;border-radius:50%;border:3px dashed var(--z-verde);opacity:.5;animation:sp 11s linear infinite}
.bigbtn .core{width:180px;height:180px;border-radius:50%;border:7px solid #fff;
  background:radial-gradient(120% 120% at 30% 20%,#1cc188,#14A673 55%,#0f8a5f);
  display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;
  box-shadow:0 22px 46px -16px rgba(20,166,115,.8)}
.bigbtn .core .cam{width:56px;height:56px;line-height:0}
.bigbtn .core .cam svg{width:100%;height:100%;fill:none;stroke:#fff;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.bigbtn .core .lb{font-family:"Poppins";font-weight:600;font-size:18px;margin-top:7px}
.clock-h{font-family:"Poppins";font-weight:600;font-size:52px;color:var(--z-verde-esc);letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums;margin-bottom:4px}
.clock-d{font-size:14px;color:var(--z-cinza);text-transform:capitalize;margin-bottom:22px}
.fila{margin-top:16px;font-size:13.5px;color:#b57611;font-weight:600;min-height:18px}

/* pareamento */
.codein{font-family:"Poppins";font-weight:600;font-size:46px;letter-spacing:16px;text-align:center;width:264px;padding:18px 0 18px 16px;
  border:1px solid var(--z-linha);border-radius:16px;color:var(--z-verde-esc);background:#fff;box-shadow:0 10px 26px -20px rgba(6,48,31,.4)}
.codein:focus{outline:none;border-color:var(--z-verde)}
.err{color:var(--z-verm);font-weight:600;margin-top:14px;min-height:20px;font-size:14px}

/* lista de cadastro */
.list{width:100%;max-width:460px;overflow:auto;max-height:66vh}
.pill{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--z-linha);border-radius:15px;
  padding:18px 20px;margin-bottom:11px;font-weight:600;font-size:18px;color:var(--z-verde-esc);cursor:pointer;box-shadow:0 8px 22px -20px rgba(6,48,31,.4)}
.pill:active{transform:scale(.99)}
.pill .tag{font-size:12.5px;font-weight:700;color:#fff;background:var(--z-ambar);padding:5px 12px;border-radius:999px}
.pill.ok .tag{background:var(--z-verde)}
.pill.ok span:first-child{color:var(--z-cinza)}
.muted{font-size:14px;color:var(--z-cinza);margin-top:18px;line-height:1.5}

/* câmera — fullscreen escuro, moldura de cantos âmbar (igual app) */
.scr-cam{padding:0;background:#0c1512;overflow:hidden}
#cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);background:#0c1512}
.cam-ov{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;
  padding:calc(env(safe-area-inset-top) + 16px) 18px calc(env(safe-area-inset-bottom) + 24px);
  background:linear-gradient(180deg,rgba(6,20,15,.55) 0%,rgba(6,20,15,0) 24%,rgba(6,20,15,0) 68%,rgba(6,20,15,.6) 100%)}
.cam-top{width:100%;display:flex;align-items:center;justify-content:space-between}
.cam-ic{width:40px;height:40px;border:none;background:rgba(0,0,0,.35);border-radius:50%;color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.cam-ttl{font-family:"Poppins";font-weight:600;font-size:18px;color:#fff}
.oval{position:relative;width:min(70vw,250px);height:min(88vw,312px);margin:auto 0 0}
.oval span{position:absolute;width:42px;height:42px;border:4px solid var(--z-ambar);transition:border-color .15s}
.oval span:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-radius:10px 0 0 0}
.oval span:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-radius:0 10px 0 0}
.oval span:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-radius:0 0 0 10px}
.oval span:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-radius:0 0 10px 0}
.oval.good span{border-color:#2fe08a}
.oval.bad span{border-color:#ff6b6b}
.hint{margin:auto 0 0;color:#fff;font-family:"Poppins";font-weight:600;font-size:18px;text-shadow:0 2px 10px rgba(0,0,0,.6);padding:0 14px;min-height:26px}

/* RESULTADO — tela cheia verde (sucesso) / vermelha (erro), igual app */
.scr-ok{background:linear-gradient(170deg,#17b07d 0%,#14A673 45%,#0f8a5f 100%);color:#fff}
.scr-err{background:linear-gradient(175deg,#e8604b 0%,#E5533D 50%,#d1452f 100%);color:#fff}
.res-circle{width:132px;height:132px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;margin-bottom:24px}
.res-circle svg{width:66px;height:66px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
#s-res h1{font-family:"Poppins";font-weight:600;font-size:36px;color:#fff;margin-bottom:0}
.res-time{font-size:19px;color:rgba(255,255,255,.92);margin-top:12px;max-width:420px;line-height:1.5}

/* loading */
.spin{width:46px;height:46px;border:4px solid var(--z-linha);border-top-color:var(--z-verde);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 18px}
@keyframes sp{to{transform:rotate(360deg)}}

/* desativar (discreto) */
.topbtn{position:fixed;top:calc(env(safe-area-inset-top) + 14px);right:14px;background:rgba(255,255,255,.85);border:1px solid var(--z-linha);
  border-radius:12px;padding:9px 13px;font-weight:600;font-size:13px;cursor:pointer;color:var(--z-cinza);z-index:5}
.backbtn{position:fixed;top:calc(env(safe-area-inset-top) + 14px);left:14px;background:#fff;border:1px solid var(--z-linha);
  border-radius:12px;padding:10px 16px;font-weight:600;font-size:15px;cursor:pointer;color:var(--z-verde-esc);z-index:5}
</style></head><body>

<div class="logo"><span class="dot">Z</span><b>Zélia Ponto</b></div>
<div class="emp" id="emp-nome"></div>

<!-- PAREAR -->
<section class="scr on" id="s-parear">
  <h1>Ativar ponto fixo</h1>
  <div class="sub">No seu painel, gere o <b>código de pareamento</b> (Configurações → Ponto fixo) e digite ele aqui.</div>
  <input class="codein" id="cod" inputmode="numeric" maxlength="4" placeholder="----">
  <div class="err" id="parear-err"></div>
  <button class="btn-verde" style="margin-top:22px" onclick="parear()">Ativar</button>
</section>

<!-- HOME (kiosk) -->
<section class="scr" id="s-home">
  <button class="topbtn" onclick="desparear()">Desativar</button>
  <div class="clock-h" id="home-hora">--:--</div>
  <div class="clock-d" id="home-data"></div>
  <div class="bigwrap">
    <button class="bigbtn" onclick="iniciarBatida()">
      <span class="ring"></span>
      <span class="core"><span class="cam"><svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></span><span class="lb">Bater ponto</span></span>
    </button>
  </div>
  <button class="btn-ghost btn-verde" id="btn-cadastrar" style="margin-top:24px" onclick="irCadastro()">Cadastrar rostos</button>
  <div class="fila" id="fila-info"></div>
</section>

<!-- LISTA CADASTRO -->
<section class="scr" id="s-lista">
  <button class="backbtn" onclick="go('s-home')">‹ Voltar</button>
  <h1>Cadastrar rosto</h1>
  <div class="sub">Toque no nome e olhe pra câmera. Faltam <b id="falta-n">0</b>.</div>
  <div class="list" id="lista-funcs"></div>
</section>

<!-- CÂMERA (cadastro + batida) — fullscreen -->
<section class="scr scr-cam" id="s-cam">
  <video id="cam" playsinline muted></video>
  <div class="cam-ov">
    <div class="cam-top">
      <button class="cam-ic" onclick="cancelarCam()">‹</button>
      <div class="cam-ttl" id="cam-ttl">Bater ponto</div>
      <div style="width:40px"></div>
    </div>
    <div class="oval" id="oval"><span></span><span></span><span></span><span></span></div>
    <div class="hint" id="hint">Carregando…</div>
  </div>
</section>

<!-- RESULTADO -->
<section class="scr" id="s-res">
  <div class="res-circle" id="res-circle"></div>
  <h1 id="res-ttl">Ponto registrado!</h1>
  <div class="res-time" id="res-sub"></div>
</section>

<!-- LOADING -->
<section class="scr" id="s-load"><div class="spin"></div><div class="sub" id="load-msg">Carregando…</div></section>

<script>
var WB="https://giantfalcon-n8n.cloudfy.live/webhook";
var LS_DEV="zelia_fixo_device", LS_EMP="zelia_fixo_empresa", LS_DID="zelia_fixo_devid";
var human=null, FUNCS=[], camStream=null, camMode=null, enrollFid=null, enrollNome=null, busy=false;
var THRESH=0.52, MARGEM=0.04;
function $(id){return document.getElementById(id);}
function go(s){ document.querySelectorAll('.scr').forEach(function(e){e.classList.remove('on');}); $(s).classList.add('on'); }
function dev(){ try{return localStorage.getItem(LS_DEV)||"";}catch(e){return "";} }
function devId(){ try{ var d=localStorage.getItem(LS_DID); if(!d){ d='fx'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); localStorage.setItem(LS_DID,d);} return d; }catch(e){return 'fx0';} }
function post(path,body){ return fetch(WB+path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}).then(function(r){return r.json().catch(function(){return {};});}); }

/* ---- relógio ---- */
function tick(){ var d=new Date(); $('home-hora').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  $('home-data').textContent=d.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'}); }
setInterval(tick,1000);

/* ---- init ---- */
if('serviceWorker' in navigator){ try{ navigator.serviceWorker.register('./sw.js'); }catch(e){} }
(function(){ if(dev()){ $('emp-nome').textContent=localStorage.getItem(LS_EMP)||""; tick(); go('s-home'); carregarFuncs(); atualizarFilaInfo(); } else { go('s-parear'); } })();

/* ---- parear ---- */
async function parear(){
  var c=($('cod').value||"").replace(/\D/g,""); var e=$('parear-err'); e.textContent="";
  if(c.length!==4){ e.textContent="Digite o código de 4 números."; return; }
  go('s-load'); $('load-msg').textContent="Ativando…";
  var d=await post("/zelia-fixo-parear",{codigo:c});
  if(d.ok){ localStorage.setItem(LS_DEV,d.device_token); localStorage.setItem(LS_EMP,d.empresa_nome||""); $('emp-nome').textContent=d.empresa_nome||""; tick(); go('s-home'); carregarFuncs(); }
  else { go('s-parear'); $('parear-err').textContent="Código inválido ou expirado. Gere outro no painel."; }
}
function desparear(){ if(!confirm("Desativar o ponto fixo neste aparelho?")) return; try{localStorage.removeItem(LS_DEV);localStorage.removeItem(LS_EMP);}catch(e){} location.reload(); }

/* ---- funcionários + templates ---- */
var TIPO_MAP={};
function salvarCache(){ try{ localStorage.setItem('zelia_fixo_funcs', JSON.stringify(FUNCS.map(function(f){return {id:f.id,nome:f.nome,tem_rosto:f.tem_rosto,vetor:f.vetor};}))); localStorage.setItem('zelia_fixo_tipos', JSON.stringify(TIPO_MAP)); }catch(e){} }
function carregarCache(){ try{ var f=JSON.parse(localStorage.getItem('zelia_fixo_funcs')||'[]'); FUNCS=f.map(function(x){return {id:x.id,nome:x.nome,tem_rosto:x.tem_rosto,vetor:x.vetor};}); TIPO_MAP=JSON.parse(localStorage.getItem('zelia_fixo_tipos')||'{}'); }catch(e){ FUNCS=[]; TIPO_MAP={}; } }
async function carregarFuncs(){
  try{
    var d=await post("/zelia-fixo-funcionarios",{device_token:dev()});
    if(d && d.ok){
      FUNCS=(d.funcionarios||[]).map(function(f){ return {id:f.id, nome:f.nome, tem_rosto:f.tem_rosto, vetor:f.vetor? l2norm(f.vetor.map(Number)):null}; });
      (d.funcionarios||[]).forEach(function(f){ if(f.ultimo_tipo) TIPO_MAP[f.id]=f.ultimo_tipo; });
      salvarCache();
    } else if(d && d.motivo==='device_invalido'){ desparearSilencioso(); return; }
    else { carregarCache(); }
  }catch(e){ carregarCache(); }   // sem internet → usa o cache do aparelho
  atualizarBtnCadastro(); atualizarFilaInfo(); sincronizarFila();
}
function atualizarBtnCadastro(){ var pend=FUNCS.filter(function(f){return !f.tem_rosto;}); var btn=$('btn-cadastrar'); if(btn) btn.textContent = pend.length? ("Cadastrar rostos ("+pend.length+")") : "Cadastrar / atualizar rostos"; }
function atualizarFilaInfo(){ var n=filaAll().length; var el=$('fila-info'); if(el) el.textContent = n? ("⏳ "+n+" batida"+(n>1?"s":"")+" aguardando internet") : ""; }
function desparearSilencioso(){ try{localStorage.removeItem(LS_DEV);localStorage.removeItem(LS_EMP);}catch(e){} go('s-parear'); $('parear-err').textContent="Pareamento expirou. Gere um novo código no painel."; }

/* ---- lista cadastro ---- */
function irCadastro(){ renderLista(); go('s-lista'); }
function renderLista(){
  var box=$('lista-funcs'); var pend=FUNCS.filter(function(f){return !f.tem_rosto;});
  $('falta-n').textContent=pend.length;
  if(!FUNCS.length){ box.innerHTML='<div class="muted">Nenhum funcionário cadastrado ainda. O dono cadastra no painel.</div>'; return; }
  box.innerHTML=FUNCS.map(function(f){ return '<div class="pill '+(f.tem_rosto?'ok':'')+'" onclick="cadastrarRosto(\''+f.id+'\',\''+(f.nome||'').replace(/'/g,"")+'\')"><span>'+esc(f.nome)+'</span><span class="tag">'+(f.tem_rosto?'✓ rosto ok':'cadastrar')+'</span></div>'; }).join("");
}
function esc(s){ return String(s||"").replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}); }

/* ---- Human ---- */
async function loadHuman(){
  if(human) return human;
  if(typeof Human==="undefined") throw new Error("lib");
  human=new Human.Human({ modelBasePath:"https://cdn.jsdelivr.net/npm/@vladmandic/human@3.3.5/models/", backend:"humangl", cacheModels:true, warmup:"none",
    face:{enabled:true, detector:{maxDetected:1, rotation:false}, mesh:{enabled:true}, iris:{enabled:true}, description:{enabled:true}, antispoof:{enabled:true}, liveness:{enabled:true}, emotion:{enabled:false}},
    body:{enabled:false}, hand:{enabled:false}, object:{enabled:false}, gesture:{enabled:false}, filter:{enabled:false} });
  await human.load(); await human.warmup(); return human;
}
async function abrirCam(){
  camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:640},height:{ideal:480}},audio:false});
  var v=$('cam'); v.srcObject=camStream; await v.play().catch(function(){});
}
function fecharCam(){ try{camStream&&camStream.getTracks().forEach(function(t){t.stop();});}catch(e){} camStream=null; camMode=null; }
function cancelarCam(){ fecharCam(); go(enrollFid?'s-lista':'s-home'); enrollFid=null; }

/* ---- CADASTRO de rosto (3 fotos) ---- */
var enrollEmbs=[], enrollStep=0, enrollBlink=false, enrollStable=0, enrollCool=0;
async function cadastrarRosto(fid,nome){
  enrollFid=fid; enrollNome=nome; enrollEmbs=[]; enrollStep=0; enrollBlink=false; enrollStable=0; enrollCool=0;
  camMode='enroll'; $('cam-ttl').textContent="Cadastrar: "+nome; go('s-cam'); $('hint').textContent="Carregando câmera…"; $('oval').className="oval";
  try{ await abrirCam(); await loadHuman(); }catch(e){ $('hint').textContent="Não consegui abrir a câmera/modelo."; return; }
  enrollLoop();
}
async function enrollLoop(){
  if(camMode!=='enroll'||!camStream) return;
  var v=$('cam');
  try{
    var r=await human.detect(v); var f=r.face&&r.face[0]; var hint=$('hint'), oval=$('oval');
    if(r.face&&r.face.length>1){ oval.className="oval bad"; hint.textContent="Só um rosto por vez"; }
    else if(!f||!f.embedding||!f.embedding.length){ oval.className="oval"; hint.textContent="Olhe pra câmera…"; }
    else{
      var score=f.faceScore||f.score||0;
      if(score<0.5){ oval.className="oval bad"; hint.textContent="Aproxime o rosto"; }
      else{
        oval.className="oval good";
        if(Date.now()>=enrollCool){
          enrollEmbs.push(Array.from(f.embedding)); enrollStep++;
          try{navigator.vibrate&&navigator.vibrate(40);}catch(e){}
          hint.textContent="Capturando… "+enrollStep+"/3";
          enrollCool=Date.now()+300;
          if(enrollStep>=3){ return salvarRosto(); }
        }
      }
    }
  }catch(e){}
  requestAnimationFrame(enrollLoop);
}
async function salvarRosto(){
  $('hint').textContent="Guardando o rosto…"; var tpl=media(enrollEmbs); fecharCam();
  go('s-load'); $('load-msg').textContent="Salvando "+enrollNome+"…";
  var d=await post("/zelia-fixo-enroll",{device_token:dev(), funcionario_id:enrollFid, template:tpl, model_version:"human-3-desc"});
  enrollFid=null;
  if(d.ok){ await carregarFuncs(); renderLista(); go('s-lista'); }
  else { alert("Não consegui salvar ("+(d.motivo||"erro")+"). Tente de novo."); go('s-lista'); }
}

/* ---- BATIDA (1-pra-todos) ---- */
var punchStable=0, punchBest=null, punchDone=false;
async function iniciarBatida(){
  var matchers=FUNCS.filter(function(f){return f.vetor;});
  if(!matchers.length){ alert("Nenhum rosto cadastrado ainda. Cadastre os rostos primeiro."); return; }
  camMode='punch'; punchStable=0; punchBest=null; punchDone=false;
  $('cam-ttl').textContent="Bater ponto"; go('s-cam'); $('hint').textContent="Carregando câmera…"; $('oval').className="oval";
  try{ await abrirCam(); await loadHuman(); }catch(e){ $('hint').textContent="Não consegui abrir a câmera/modelo."; return; }
  punchLoop();
}
async function punchLoop(){
  if(camMode!=='punch'||!camStream||punchDone) return;
  var v=$('cam');
  try{
    var r=await human.detect(v); var f=r.face&&r.face[0]; var hint=$('hint'), oval=$('oval');
    if(!f||!f.embedding||!f.embedding.length){ punchStable=0; oval.className="oval"; hint.textContent="Olhe pra câmera…"; }
    else{
      var live=(typeof f.live==="number"?f.live:1), real=(typeof f.real==="number"?f.real:1), vivo=live>0.6&&real>0.5;
      var e=l2norm(Array.from(f.embedding));
      var m=melhorMatch(e);  // {id,nome,sim,sim2}
      if(!vivo){ punchStable=0; oval.className="oval bad"; hint.textContent="Rosto não parece vivo (foto?)"; }
      else if(m.sim>=THRESH && (m.sim-m.sim2)>=MARGEM){
        oval.className="oval good";
        if(punchBest && punchBest.id===m.id) punchStable++; else { punchBest=m; punchStable=1; }
        hint.textContent="Reconhecendo "+m.nome.split(" ")[0]+"… "+(m.sim*100).toFixed(0)+"%";
        if(punchStable>=3){ punchDone=true; return baterPonto(m); }
      } else { punchStable=0; punchBest=null; oval.className="oval"; hint.textContent="Reconhecendo…"; }
    }
  }catch(e){}
  requestAnimationFrame(punchLoop);
}
function melhorMatch(e){
  var best={id:null,nome:"",sim:-1}, second=-1;
  FUNCS.forEach(function(f){ if(!f.vetor) return; var s=cosSim(e,f.vetor);
    if(s>best.sim){ second=best.sim; best={id:f.id,nome:f.nome,sim:s}; } else if(s>second){ second=s; } });
  best.sim2=second<0?0:second; return best;
}
var SEQ={'':'entrada', entrada:'pausa', pausa:'retorno', retorno:'saida', saida:'entrada'};
var LABELS={entrada:"Entrada",saida:"Saída",pausa:"Almoço",retorno:"Retorno"};
async function baterPonto(m){
  fecharCam();
  var tipo = SEQ[TIPO_MAP[m.id]||''] || 'entrada';
  var gps=await pegarGPS(); var agora=new Date();
  var punch={ funcionario_id:m.id, nome:m.nome, tipo:tipo, registrado_em:isoBahia(agora),
    gps_timestamp:gps?isoBahia(new Date(gps.ts)):null, latitude:gps?gps.latitude:null, longitude:gps?gps.longitude:null, accuracy_metros:gps?gps.accuracy:null };
  var tn=LABELS[tipo]||"Ponto", pn=m.nome.split(" ")[0];
  if(navigator.onLine){
    go('s-load'); $('load-msg').textContent="Registrando "+pn+"…";
    var r=await enviarPunch(punch);
    if(r.ok){ TIPO_MAP[m.id]=tipo; salvarCache(); mostrarRes("ok","Pronto, "+pn+"!", tn+" registrada às "+horaAgora()); return; }
    if(r.recusa){ mostrarRes("erro","Não deu", r.mensagem||"Não foi possível registrar."); return; }
    // falha de rede → cai pra fila offline
  }
  filaAdd(punch); TIPO_MAP[m.id]=tipo; salvarCache(); atualizarFilaInfo();
  mostrarRes("ok","Pronto, "+pn+"!", tn+" às "+horaAgora()+" — sem internet, sobe sozinho quando voltar.");
}
async function enviarPunch(punch){
  try{
    var sess=await post("/zelia-fixo-sessao",{device_token:dev(), funcionario_id:punch.funcionario_id});
    if(!sess.ok){ if(sess.motivo==='device_invalido') return {ok:false}; return {ok:false, recusa:true, mensagem:"Funcionário não encontrado."}; }
    var payload={ tipo:punch.tipo, registrado_em:punch.registrado_em, gps_timestamp:punch.gps_timestamp,
      latitude:punch.latitude, longitude:punch.longitude, accuracy_metros:punch.accuracy_metros,
      foto_base64:null, metodo:'facial', device_id:devId(), local_id:punch._id||('fx'+Date.now()), token:sess.token };
    var d=await post("/zelia-registrar",payload);
    if(d.ok) return {ok:true};
    if(d.mensagem) return {ok:false, recusa:true, mensagem:d.mensagem};   // recusa do servidor (sequência/geofence)
    return {ok:false};
  }catch(e){ return {ok:false}; }   // rede
}
/* ---- fila offline ---- */
function filaAll(){ try{ return JSON.parse(localStorage.getItem('zelia_fixo_fila')||'[]'); }catch(e){ return []; } }
function filaSave(a){ try{ localStorage.setItem('zelia_fixo_fila', JSON.stringify(a)); }catch(e){} }
function filaAdd(p){ var a=filaAll(); p._id='q'+Date.now()+Math.random().toString(36).slice(2,6); a.push(p); filaSave(a); }
var sincronizando=false;
async function sincronizarFila(){
  if(sincronizando||!navigator.onLine) return; var a=filaAll(); if(!a.length) return; sincronizando=true;
  a.sort(function(x,y){return x.registrado_em<y.registrado_em?-1:1;});
  for(var i=0;i<a.length;i++){
    var r=await enviarPunch(a[i]);
    if(r.ok || r.recusa){ filaSave(filaAll().filter(function(q){return q._id!==a[i]._id;})); }
    else { break; }   // rede caiu de novo: para e tenta depois
  }
  sincronizando=false; atualizarFilaInfo();
}
window.addEventListener('online', function(){ sincronizarFila(); });
function mostrarRes(tipo,ttl,sub){
  var s=$('s-res');
  document.querySelectorAll('.scr').forEach(function(e){ if(e!==s) e.classList.remove('on'); });
  s.className='scr '+(tipo==='ok'?'scr-ok':'scr-err')+' on';
  $('res-circle').innerHTML = tipo==='ok'
    ? '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>'
    : '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>';
  $('res-ttl').textContent=ttl; $('res-sub').textContent=sub;
  setTimeout(function(){ if(s.classList.contains('on')){ s.className='scr'; go('s-home'); carregarFuncs(); } }, 3200);
}

/* ---- helpers ---- */
function l2norm(v){ var s=0; for(var i=0;i<v.length;i++) s+=v[i]*v[i]; s=Math.sqrt(s)||1; return v.map(function(x){return x/s;}); }
function media(vs){ var n=vs[0].length,o=new Array(n).fill(0); vs.forEach(function(v){for(var i=0;i<n;i++)o[i]+=v[i];}); for(var i=0;i<n;i++)o[i]/=vs.length; return l2norm(o); }
function cosSim(a,b){ if(!a||!b||a.length!==b.length) return -1; var s=0; for(var i=0;i<a.length;i++) s+=a[i]*b[i]; return s; }
function horaAgora(){ var d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function isoBahia(d){ var utc=d.getTime()+d.getTimezoneOffset()*60000; var b=new Date(utc-3*3600000); var p=function(n){return String(n).padStart(2,'0');};
  return b.getFullYear()+'-'+p(b.getMonth()+1)+'-'+p(b.getDate())+'T'+p(b.getHours())+':'+p(b.getMinutes())+':'+p(b.getSeconds())+'-03:00'; }
function pegarGPS(){ return new Promise(function(res){ if(!navigator.geolocation) return res(null);
  navigator.geolocation.getCurrentPosition(function(p){ res({latitude:p.coords.latitude,longitude:p.coords.longitude,accuracy:p.coords.accuracy,ts:p.timestamp}); },
  function(){ res(null); }, {enableHighAccuracy:true,timeout:6000,maximumAge:30000}); }); }
</script>
